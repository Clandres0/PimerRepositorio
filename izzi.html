<body class="home">

<header class="site-header">
    <div class="header-top">
        <div class="titulo-pagina">
            <h1>

            <p class="subtitulo">INDUMENTARIA DEPORTIVA</p>
        </div>

        <button class="lang-switch" onclick="toggleLang()">PT / ES</button>
    </div>

    <div class="nav-search-container">
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="camisas.html" data-i18n="nav.shirts">Camisetas</a></li>
                <li><a href="pantalones.html" data-i18n="nav.pants">Pantalones</a></li>
                <li><a href="conjuntos.html" data-i18n="nav.sets">Conjuntos</a></li>
            </ul>
        </nav>

        <form class="search-form" role="search">

        <div class="productos-grid">

            <article class="producto">

            <article class="producto">

                </a>
                <h3 class="nombre-producto">Paris Saint-Germain</h3>
            </article>

            <article class="producto">
                <a href="3d-view.html?model=producto5.glb" class="producto-link">

            <article class="producto">
                <a href="3d-view.html?model=producto6.glb" class="producto-link">

            <article class="producto">

            <article class="producto">
                <a href="3d-view.html?model=producto8.glb" class="producto-link">

                </a>
                <h3 class="nombre-producto">Borussia Dortmund</h3>
            </article>

        </div>
    </section>

    <aside class="music-player">
        <h4 id="currentSongTitle"></h4>

        <audio id="audioPlayer">
            <source src="" type="audio/mpeg">
            Tu navegador no soporta audio.
        </audio>

        <div class="controls-row">
            <button id="skipBackward" class="circle-btn">
                <i class="bi bi-skip-start-fill"></i>
            </button>
            <button id="playPause" class="circle-btn">
                <i class="bi bi-play-fill"></i>
            </button>
            <button id="skipForward" class="circle-btn">
                <i class="bi bi-skip-end-fill"></i>
            </button>

            <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5">
        </div>

        <input type="range" id="progressBar" min="0" max="100" value="0">
    </aside>
